name: Build Frontline FPS 3D

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Three.js
        run: |
          npm install --no-save three esbuild

      - name: Bundle Game
        run: |
          npx esbuild app/src/main/assets/game.js \
            --bundle \
            --format=esm \
            --outfile=app/src/main/assets/game.bundle.js

          sed -i 's/game.js/game.bundle.js/' \
            app/src/main/assets/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-FPS3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
